name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The owner's phone test of the realistic art look (docs/research/art/realistic/phone-test): the sprites are
      # baked here with three.js in headless Chromium (SwiftShader, about 10 minutes) because the release check keeps
      # raster images out of the repository, then served at /real-test/ beside the game. Uses the Playwright that
      # @playwright/test already pulls in (package.json is unchanged).
      - name: Install Chromium for the realistic look bake
        run: npx playwright install --with-deps chromium
      - name: Bake the realistic look phone test
        run: node docs/research/art/realistic/phone-test/bake.cjs
      - name: Copy the realistic look phone test into the site
        run: |
          mkdir -p dist/real-test
          cp docs/research/art/realistic/phone-test/index.html docs/research/art/realistic/phone-test/test.js dist/real-test/
          cp -r docs/research/art/realistic/phone-test/dist dist/real-test/dist
      # The owner's view of the pixel art test (stage 0b, branch phase8b-stage0b-proto, never merged):
      # built in app mode with the pixel look and the Bench buttons, served at /pixel-test/ beside the game.
      - uses: actions/checkout@v4
        with:
          ref: phase8b-stage0b-proto
          path: pixel-test-src
      - name: Build the pixel art test
        working-directory: pixel-test-src
        env:
          VITE_ART: pixel
          VITE_BENCH: '1'
        run: |
          npm ci
          npx vite build --mode app --outDir ../dist/pixel-test
      # The owner gate for phase 8c stage 1 (branch phase8c-stage1, never merged): the realistic art reader and the
      # bench, built with VITE_ART=real and served at /real-game/ (open /real-game/?art=real&bench=1 for the bench).
      # The sprites are baked here by tools/art3d/bake.mjs in headless Chromium (the Playwright installed above).
      # The bake keeps a per-item cache in dist-art/cache, keyed on the bake tools, so an unchanged kit is a warm
      # run (S8: 60 minutes warm, 4 hours cold). The log prints the bake's time and size lines for the report.
      - uses: actions/checkout@v4
        with:
          ref: phase8c-stage1
          path: real-game-src
      - name: Install the realistic game dependencies
        working-directory: real-game-src
        run: npm ci
      - name: Restore the bake cache
        uses: actions/cache@v4
        with:
          path: real-game-src/dist-art/cache
          key: real-game-bake-${{ hashFiles('real-game-src/tools/art3d/**') }}
          restore-keys: |
            real-game-bake-
      - name: Bake the realistic game art
        working-directory: real-game-src
        run: |
          start=$(date +%s)
          node tools/art3d/bake.mjs --out dist-art/real | tee ../real-game-bake.log
          echo "bake wall time: $(( $(date +%s) - start )) s"
          echo "---- bake size and time lines ----"
          grep -E '^(total:|items:|kind |index )' ../real-game-bake.log
          du -sh dist-art/real dist-art/cache
      - name: Check the baked index
        working-directory: real-game-src
        run: npx tsx tools/art3d/checkIndex.ts dist-art/real
      - name: Build the realistic game
        working-directory: real-game-src
        env:
          VITE_ART: real
        run: npx vite build --outDir ../dist/real-game
      - name: Copy the baked art into the realistic game
        run: |
          mkdir -p dist/real-game/art
          cp -r real-game-src/dist-art/real dist/real-game/art/real
          test -f dist/real-game/index.html
          test -f dist/real-game/art/real/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
