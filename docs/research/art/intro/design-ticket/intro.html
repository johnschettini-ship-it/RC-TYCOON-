<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrills &amp; Chills: intro, design D (the ticket)</title>
<link rel="stylesheet" href="../kit3/base.css">
<style>
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffab33; }
  .screen .desktop { display: block; }
  .screen .phone { display: none; }

  /* Pixel pictures: every one at 2x with hard pixels, on even pixel positions (one grid for the whole screen). */
  .scene { position: absolute; left: 0; top: 0; }
  .scene.desktop { width: 1280px; height: 800px; }   /* 640 x 400 art pixels */
  .scene.phone { width: 390px; height: 844px; }      /* 195 x 422 art pixels */

  /* The ticket: a pixel picture of the paper; the lettering is a second picture; small print and buttons are HTML. */
  .ticket { position: absolute; left: 112px; top: 52px; width: 1056px; height: 424px; --paper: #ffe9bf; }
  .paper { position: absolute; left: 0; top: 0; }
  .paper.desktop { width: 1056px; height: 424px; }   /* 528 x 212 art pixels */
  .paper.phone { width: 350px; height: 648px; }      /* 175 x 324 art pixels */

  .main { position: absolute; left: 0; top: 0; width: 744px; height: 420px; }
  .logo { position: absolute; left: 46px; top: 100px; margin: 0; }
  .logo img.desktop { width: 652px; height: 84px; }  /* 326 x 42 art pixels */
  .logo img.phone { width: 270px; height: 226px; }   /* 135 x 113 art pixels */
  .tagline { position: absolute; left: 0; width: 744px; top: 208px; margin: 0; text-align: center; font-size: 20px; line-height: 26px; font-weight: 500; color: var(--ink); }

  .tagline b { font-weight: 600; }
  .tagline .warm { color: var(--logo-thrill); }
  .tagline .cool { color: var(--logo-chill); }

  /* Small print of the ticket. */
  .print { position: absolute; margin: 0; font-weight: 700; font-size: 13px; line-height: 16px; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; color: var(--ink); }
  .print.warm { color: var(--logo-thrill); }
  .print.cool { color: var(--logo-chill); }
  .main .p1 { left: 48px; top: 46px; }
  .main .p2 { right: 46px; top: 46px; }
  .main .p3 { left: 132px; top: 312px; }
  .main .p4 { right: 130px; top: 312px; }
  .main .p5 { left: 0; width: 744px; text-align: center; top: 312px; color: var(--muted-ink); }

  /* The stub: the menu. Every item is its own plate (a .btn of the game's interface) with a coupon notch on each side. */
  .stub { position: absolute; left: 744px; top: 0; width: 312px; height: 420px; padding: 62px 28px 0 30px; display: flex; flex-direction: column; gap: 12px; }
  .stub .admit { left: 0; width: 312px; top: 26px; text-align: center; font-size: 15px; line-height: 20px; }
  .stub .serial { left: 186px; top: 373px; font-size: 12px; color: var(--muted-ink); }
  .stub .btn { position: relative; width: 100%; }
  .stub .btn::before, .stub .btn::after { content: ''; position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px; border: 3px solid var(--ink); border-radius: 50%; background: var(--paper); }
  .stub .btn::before { left: -12px; clip-path: inset(0 0 0 9px); }
  .stub .btn::after { right: -12px; clip-path: inset(0 9px 0 0); }
  .stub .btn.go { min-height: 64px; font-size: 22px; flex-direction: column; line-height: 1.05; }
  .stub .btn.go small { font-size: 13px; font-weight: 500; }
  .stub .btn.new { min-height: 56px; font-size: 20px; background: var(--gold); }
  .stub .btn.sm { background: var(--surface); font-size: 17px; padding: 0 6px; }
  .stub .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  @media (max-width: 600px) {
    .screen .desktop { display: none; }
    .screen .phone { display: block; }
    .ticket { left: 20px; top: 12px; width: 350px; height: 648px; }
    .main { width: 350px; height: 372px; }
    .logo { left: 40px; top: 54px; }
    .main .p1 { left: 34px; top: 30px; font-size: 11px; }
    .main .p2 { right: 32px; top: 30px; font-size: 11px; }
    .main .p3, .main .p4, .main .p5 { display: none; }
    .tagline { width: 350px; top: 292px; font-size: 15px; line-height: 20px; }
    .tagline span { display: block; }
    .stub { left: 0; top: 372px; width: 350px; height: 272px; padding: 14px 18px 0; gap: 10px; }
    .stub .admit, .stub .serial { display: none; }
    .stub .btn.go { min-height: 58px; }
    .stub .btn.new { min-height: 52px; }
    .stub .grid { gap: 10px; }
  }
</style>
</head>
<body>
<main class="screen">
  <img class="px scene desktop" src="scene-desktop.png" alt="">
  <img class="px scene phone" src="scene-phone.png" alt="">
  <section class="ticket">
    <img class="px paper desktop" src="ticket-desktop.png" alt="">
    <img class="px paper phone" src="ticket-phone.png" alt="">
    <header class="main">
      <p class="print p1">Park pass</p>
      <p class="print p2">No. 000128</p>
      <h1 class="logo">
        <img class="px desktop" src="logo-desktop.png" alt="Thrills &amp; Chills">
        <img class="px phone" src="logo-phone.png" alt="Thrills &amp; Chills">
      </h1>
      <p class="tagline"><span>Build a park for <b class="warm">thrill seekers</b></span> <span>and <b class="cool">chill seekers</b></span></p>
      <p class="print warm p3">Thrill side</p>
      <p class="print p5">Good for all rides</p>
      <p class="print cool p4">Chill side</p>
    </header>
    <nav class="stub" aria-label="Main menu">
      <p class="print admit">Admit one</p>
      <button class="btn primary go" data-menu>Continue<small>Maple Hollow &middot; Year 2</small></button>
      <button class="btn new" data-menu>New game</button>
      <div class="grid">
        <button class="btn sm" data-menu>Load</button>
        <button class="btn sm" data-menu>Import</button>
        <button class="btn sm" data-menu>Settings</button>
        <button class="btn sm" data-menu>Credits</button>
      </div>
      <p class="print serial">000128</p>
    </nav>
  </section>
</main>
</body>
</html>
